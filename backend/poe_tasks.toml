[tasks.fmt]
help = "Format and auto-fix lint issues"
sequence = [
  { cmd = "ruff format ." },
  { cmd = "ruff check . --fix" },
]

[tasks.fmt-check]
help = "Check formatting without modifying files"
cmd = "ruff format . --check"

[tasks.lint]
help = "Run lint checks"
sequence = [
  "fmt-check",
  { cmd = "ruff check ." },
]

[tasks.type]
help = "Run static type checks"
cmd = "mypy src"

[tasks.test]
help = "Run tests"
cmd = "pytest tests"

[tasks.test-control]
help = "Run deterministic control-layer and capability system tests"
cmd = "pytest tests/ai/control tests/api/test_conversations_api.py tests/api/test_current_wallet_state_api.py tests/scripts/devex/transaction_capture_smoke/test_scenarios.py tests/application/test_transaction_service.py"

[tasks.serve]
help = "Run the FastAPI app locally with reload"
cmd = "uvicorn --factory wallet.api.app:create_app --reload --no-access-log --log-config logging.json"

[tasks.smoke]
help = "Run the manual API smoke scenarios against an existing backend"
cmd = "python -m scripts.devex.smoke.run"

[tasks.smoke-managed]
help = "Run the manual API smoke scenarios with a managed backend process"
cmd = "python -m scripts.devex.smoke.run --managed"

[tasks.capture-smoke]
help = "Run transaction-capture API smoke scenarios against local Ollama"
cmd = "python -m scripts.devex.transaction_capture_smoke"

[tasks.router-smoke]
help = "Run the message-router classification corpus against local Ollama"
cmd = "python -m scripts.devex.message_router_smoke"

[tasks.export-openapi]
help = "Export the OpenAPI schema for frontend client generation"
cmd = "python scripts/devex/export_openapi.py"

[tasks.clean]
help = "Remove caches and generated local artifacts"
cmd = "python scripts/devex/clean.py"

[tasks.seed-sample-data]
help = "Build and print the local sample dataset"
cmd = "python scripts/devex/seed_sample_data.py"

[tasks.verify]
help = "Run the read-only verification suite"
sequence = ["lint", "type", "test"]

[tasks.check]
help = "Alias for the read-only verification suite"
sequence = ["verify"]
